databaseChangeLog:
  - changeSet:
      id: 001-create-products
      author: pedidos360
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(4000)
              - column:
                  name: price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: stock
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(2048)
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
        - sql:
            sql: ALTER TABLE products ADD CONSTRAINT products_price_nonnegative CHECK (price >= 0)
        - sql:
            sql: ALTER TABLE products ADD CONSTRAINT products_stock_nonnegative CHECK (stock >= 0)
