#quizas de problemas si es que no tiene el mismo nombre de la aplicación que registre en Entra ID.
spring.application.name=ms-catalog 

server.port=8080

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

#TENANT_ID:f9bce5c0-eb96-4341-aad7-411ae980b12a
#API_CLIENT_ID:15f9fdcd-344e-4a9b-931c-9980f055b722

# issuer-uri: Spring descarga automaticamente las llaves publicas de Entra ID
# desde <issuer-uri>/.well-known/openid-configuration y con ellas verifica la firma.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/f9bce5c0-eb96-4341-aad7-411ae980b12a/v2.0

# audiences: el token debe venir dirigido a NUESTRA API.
# Sin esto, un token emitido para otra aplicacion del mismo tenant seria aceptado.
spring.security.oauth2.resourceserver.jwt.audiences=15f9fdcd-344e-4a9b-931c-9980f055b722

