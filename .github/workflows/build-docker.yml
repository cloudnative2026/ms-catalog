name: MS Catalog Deploy

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build JAR
        run: |
          chmod +x ./mvnw
          ./mvnw clean package

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REPO: ${{ secrets.ECR_REPO_URL_MS_CATALOG }}
        run: |
          set -eu
          docker build -t "$ECR_REPO:latest" .
          docker push "$ECR_REPO:latest"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPO: ${{ secrets.ECR_REPO_URL_MS_CATALOG }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          envs:  AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION,ECR_REGISTRY,ECR_REPO,DB_HOST,DB_PORT,DB_USERNAME,DB_PASSWORD

          script: |
            set -eu

            : "${DB_HOST:?Falta DB_HOST}"
            : "${DB_PORT:?Falta DB_PORT}"
            : "${DB_USERNAME:?Falta DB_USERNAME}"
            : "${DB_PASSWORD:?Falta DB_PASSWORD}"

            if ! printf '%s' "$DB_NAME" \
              | grep -Eq '^[A-Za-z0-9_]{1,64}$'; then
              echo "DB_NAME debe tener entre 1 y 64 caracteres: letras, numeros o guion bajo."
              exit 1
            fi

            echo "Logging into ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" \
              | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

            echo "Pulling ms-catalog..."

            docker pull "$ECR_REPO:latest"

            echo "Ensuring catalog database exists..."

            docker run --rm \
              -e MYSQL_PWD="$DB_PASSWORD" \
              mysql:8.4 \
              mysql \
                --host="$DB_HOST" \
                --port="$DB_PORT" \
                --user="$DB_USERNAME" \
                --protocol=TCP \
                --connect-timeout=15 \
                --ssl-mode=REQUIRED \
                --execute="CREATE DATABASE IF NOT EXISTS \`$DB_NAME\` CHARACTER SET utf8mb4;"

            echo "Stopping previous container..."

            docker stop ms-catalog || true
            docker rm ms-catalog || true

            echo "Starting ms-catalog..."

            docker run -d \
            --name ms-catalog \
            --restart unless-stopped \
            -p 8080:8080 \
            -e DB_HOST="$DB_HOST" \
            -e DB_PORT="$DB_PORT" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            "$ECR_REPO:latest"

            echo "Container started."

            docker ps --filter name=ms-catalog
