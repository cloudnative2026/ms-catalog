name: MS Catalog Deploy

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  CONTAINER_NAME: ms-catalog
  HOST_PORT: 8080
  CONTAINER_PORT: 8080

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build JAR
        run: |
          chmod +x ./mvnw
          ./mvnw clean package

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ms-catalog:latest .
          docker tag ms-catalog:latest \
            ${{ secrets.ECR_REPO_URL_MS_CATALOG }}:latest

      - name: Push image to ECR
        run: |
          docker push \
            ${{ secrets.ECR_REPO_URL_MS_CATALOG }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPO: ${{ secrets.ECR_REPO_URL_MS_CATALOG }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION,ECR_REGISTRY,ECR_REPO

          script: |
            set -e

            echo "Logging into ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" \
              | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

            echo "Pulling ms-catalog..."

            docker pull "$ECR_REPO:latest"

            echo "Stopping previous container..."

            docker stop ms-catalog || true
            docker rm ms-catalog || true

            echo "Starting ms-catalog..."

            docker run -d \
              --name ms-catalog \
              --restart unless-stopped \
              -p 8080:8080 \
              "$ECR_REPO:latest"

            echo "Deployment completed."

            docker ps